input {
  beats {
    port => 5044
  }
}

filter {
  # -------------------------------------------------------------------------
  # 1. Source metadata from filepath
  # -------------------------------------------------------------------------
  if [log][file][path] {
    grok {
      match => { "[log][file][path]" => "execution_trace_%{DATA:stream_name}_%{YEAR:file_date_year}%{MONTHNUM:file_date_month}%{MONTHDAY:file_date_day}_%{INT:file_seq}\.log" }
      tag_on_failure => []
    }
  } else if [path] {
    grok {
      match => { "path" => "execution_trace_%{DATA:stream_name}_%{YEAR:file_date_year}%{MONTHNUM:file_date_month}%{MONTHDAY:file_date_day}_%{INT:file_seq}\.log" }
      tag_on_failure => []
    }
  }

  # -------------------------------------------------------------------------
  # 2. Base envelope
  #    YYYYMMDD HHmmss.SSS LEVEL COMPONENT [NODE] PAYLOAD
  # -------------------------------------------------------------------------
  grok {
    match => {
      "message" => "^(?<log_timestamp>\d{8}\s+\d{6}\.\d{3})\s+(?<log_level>[A-Z])\s+(?<log_component>[A-Za-z0-9_-]+)\s*(?:\[(?<node_name>[^\]]+)\]\s*)?(?<log_payload>.*)$"
    }
    tag_on_failure => ["_grokparsefailure_envelope"]
  }

  if "_grokparsefailure_envelope" not in [tags] {
    mutate {
      strip => ["log_payload"]
    }

    date {
      match    => [ "log_timestamp", "yyyyMMdd HHmmss.SSS" ]
      target   => "@timestamp"
      timezone => "UTC"
    }

    mutate { add_field => { "log_severity" => "%{log_level}" } }
    if [log_level] in ["L","I"] {
      mutate { replace => { "log_severity" => "INFO"  } }
    } else if [log_level] == "W" {
      mutate { replace => { "log_severity" => "WARN"  } }
    } else if [log_level] == "E" {
      mutate { replace => { "log_severity" => "ERROR" } }
    } else if [log_level] == "D" {
      mutate { replace => { "log_severity" => "DEBUG" } }
    } else if [log_level] == "F" {
      mutate { replace => { "log_severity" => "FATAL" } }
    }

    # -----------------------------------------------------------------------
    # 3. Functional parsing
    # -----------------------------------------------------------------------

    # A) File performance (real / CPU time)
    if [log_payload] =~ /^File\s+\S+\s*:\s*Performance:/ {
      grok {
        match => {
          "log_payload" => "^File\s+(?<source_stream_id>[^:]+):(?<file_id>\S+)\s*:\s*Performance:\s*real\s+%{NUMBER:real_time_sec:float}s\s+\(%{NUMBER:real_event_rate:float}\s+ER/s\),\s+CPU\s+%{NUMBER:cpu_time_sec:float}s\s+\(%{NUMBER:cpu_event_rate:float}\s+ER/s\)"
        }
        tag_on_failure => ["_grokparsefailure_performance"]
      }
      if "_grokparsefailure_performance" not in [tags] {
        mutate { add_field => { "event_type" => "file_performance" } }
        ruby {
          code => '
            r = event.get("real_time_sec"); c = event.get("cpu_time_sec")
            if r && c && r.to_f > 0
              event.set("cpu_utilization_pct", ((c.to_f / r.to_f) * 100.0).round(2))
            end
          '
        }
      }
    }

    # B) File journey
    else if [log_payload] =~ /^File\s+\S+\s*:\s*(Collected|Distributed|Transferred|Processed)\s+file/ {
      grok {
        match => {
          "log_payload" => "^File\s+(?<source_stream_id>[^:]+):(?<file_id>\S+)\s*:\s*(?<file_action>Collected|Distributed|Transferred|Processed)\s+file\s+%{NOTSPACE:file_name}(?:\s+\((?<internal_file_id>[^\)]+)\))?,\s+%{INT:file_size_bytes:int}\s+bytes,\s+%{TIME:transfer_start_time}\s+-\s+%{TIME:transfer_end_time}"
        }
        tag_on_failure => ["_grokparsefailure_file_action"]
      }
      if "_grokparsefailure_file_action" not in [tags] {
        mutate {
          add_field => { "event_type" => "file_journey" "file_count" => 1 }
        }
        # NOTE: convert must be a separate mutate block — inside a single
        # mutate, convert runs before add_field, so the field would stay a
        # string and map as text in Elasticsearch.
        mutate {
          convert => { "file_count" => "integer" }
        }
        ruby {
          code => '
            b = event.get("file_size_bytes")
            if b
              event.set("file_size_kb", (b.to_f / 1024.0).round(2))
              event.set("file_size_mb", (b.to_f / 1048576.0).round(3))
            end
          '
        }
      }
    }

    # C) I/O throughput
    else if [log_payload] =~ /^File\s+\S+\s*:\s*I\/O throughput:/ {
      grok {
        match => {
          "log_payload" => "^File\s+(?<source_stream_id>[^:]+):(?<file_id>\S+)\s*:\s*I/O throughput:\s*read\s+%{NUMBER:io_read_throughput_mb_s:float}\s+MB/s,\s+wrote\s+%{NUMBER:io_write_throughput_mb_s:float}\s+MB/s"
        }
        tag_on_failure => ["_grokparsefailure_io_throughput"]
      }
      if "_grokparsefailure_io_throughput" not in [tags] {
        mutate { add_field => { "event_type" => "file_io_throughput" } }
      }
    }

    # D) I/O stats
    else if [log_payload] =~ /^File\s+\S+\s*:\s*I\/O stats:/ {
      grok {
        match => {
          "log_payload" => "^File\s+(?<source_stream_id>[^:]+):(?<file_id>\S+)\s*:\s*I/O stats:\s*read\s+%{INT:io_read_bytes:int}\s+\(%{INT:io_read_requests:int}\s+requests\),\s+wrote\s+%{INT:io_write_bytes:int}\s+\(%{INT:io_write_requests:int}\s+requests\)"
        }
        tag_on_failure => ["_grokparsefailure_io_stats"]
      }
      if "_grokparsefailure_io_stats" not in [tags] {
        mutate { add_field => { "event_type" => "file_io_stats" } }
      }
    }

    # E) File transfer & Connection errors
    else if [log_payload] =~ /Unable to transfer file/ {
      grok {
        match => {
          "log_payload" => "^(?:(?<error_code>[A-Za-z0-9_]+)\s+)?(?:Error message:\s+)?Unable to transfer file\s*:\s*'%{NOTSPACE:target_file_path}'(?:\s+after\s+%{INT:retry_count:int}\s+retries)?\s*:\s*(?<error_reason>.*)$"
        }
        tag_on_failure => ["_grokparsefailure_transfer_error"]
      }
      if "_grokparsefailure_transfer_error" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "file_transfer_error"
            "transfer_status" => "FAILED"
          }
        }
      }
    }
    else if [log_payload] =~ /Unable to create (?:FTP|SFTP) connection/ {
      grok {
        match => {
          "log_payload" => "^(?:(?<error_code>[A-Za-z0-9_]+)\s+)?(?:Error message:\s+)?Unable to create\s+(?<connection_protocol>FTP|SFTP)\s+connection\s*:\s*(?<error_reason>.*)$"
        }
        tag_on_failure => ["_grokparsefailure_conn_error"]
      }
      if "_grokparsefailure_conn_error" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "connection_error"
            "transfer_status" => "FAILED"
          }
        }
      }
    }

    # F) Scheduled executions
    else if [log_payload] =~ /^Scheduled execution id/ {
      grok {
        match => {
          "log_payload" => "^Scheduled execution id\s+%{NOTSPACE:scheduled_execution_id}\s+(?<scheduled_status>starting|finished successfully)\s+at\s+%{TIME:scheduled_time}"
        }
        tag_on_failure => ["_grokparsefailure_scheduled_execution"]
      }
      if "_grokparsefailure_scheduled_execution" not in [tags] {
        mutate { add_field => { "event_type" => "scheduled_execution" } }
      }
    }

    # G) JVM memory
    else if [log_payload] =~ /^Java VM memory info/ {
      grok {
        match => {
          "log_payload" => "^Java VM memory info\s*\(Max:\s*%{INT:jvm_max_memory_bytes:int},\s*Total:\s*%{INT:jvm_total_memory_bytes:int},\s*Free:\s*%{INT:jvm_free_memory_bytes:int}\)"
        }
        tag_on_failure => ["_grokparsefailure_jvm_memory"]
      }
      if "_grokparsefailure_jvm_memory" not in [tags] {
        mutate { add_field => { "event_type" => "jvm_memory_metrics" } }
        ruby {
          code => '
            t = event.get("jvm_total_memory_bytes"); f = event.get("jvm_free_memory_bytes")
            if t && f
              used = t - f
              event.set("jvm_used_memory_bytes", used)
              event.set("jvm_used_memory_mb",  (used.to_f  / 1048576.0).round(2))
              event.set("jvm_total_memory_mb", (t.to_f     / 1048576.0).round(2))
            end
          '
        }
      }
    }

    # H) Stream / Log lifecycle & Orders
    else if [log_payload] =~ /^(?:Opened this log file for stream|(?:Stream\s+)?internals in|Log (?:was|is) rotated|Log closed|Logging started)/ {
      grok {
        match => {
          "log_payload" => [
            '^Opened this log file for stream\s+"%{DATA:stream_name}"',
            '^(?:Stream\s+)?internals in\s+"%{DATA:stream_internals_path}"',
            '^(?<log_lifecycle_event>Log was rotated|Log is rotated|Log closed|Logging started)'
          ]
        }
        tag_on_failure => []
      }
      mutate { add_field => { "event_type" => "stream_lifecycle" } }
    }
    else if [log_payload] =~ /^Executing\s+'[A-Z_]+'\s+order/ {
      grok {
        match => {
          "log_payload" => "^Executing\s+'%{WORD:order_type}'\s+order\s+\(ID:\s*%{INT:order_id:int}\)(?:\s+for stream\s+%{DATA:stream_name})?(?:,\s*(?:from version\s+%{INT:stream_from_version:int}\s+to\s+version\s+%{INT:stream_to_version:int}|version\s+%{INT:stream_version:int}))?"
        }
        tag_on_failure => ["_grokparsefailure_stream_order"]
      }
      if "_grokparsefailure_stream_order" not in [tags] {
        mutate { add_field => { "event_type" => "stream_order" } }
      }
    }
    else if [log_payload] =~ /order\s+\(ID:\s*\d+\)\s+execution finished/ {
      grok {
        match => {
          "log_payload" => "^'%{WORD:order_type}'\s+order\s+\(ID:\s*%{INT:order_id:int}\)\s+execution finished,\s*status was\s+'%{WORD:order_status}'"
        }
        tag_on_failure => ["_grokparsefailure_order_finish"]
      }
      if "_grokparsefailure_order_finish" not in [tags] {
        mutate { add_field => { "event_type" => "stream_order_finished" } }
      }
    }
    else if [log_payload] =~ /^Successfully executed Lookup Server/ {
      grok {
        match => {
          "log_payload" => "^Successfully executed Lookup Server\s+'(?<order_type>[^']+)'\s+order\s+\(ID:\s*%{INT:order_id:int}\)"
        }
        tag_on_failure => ["_grokparsefailure_lookup_order"]
      }
      if "_grokparsefailure_lookup_order" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "stream_order_finished"
            "order_status" => "SUCCESS"
          }
        }
      }
    }

    # I) Node lifecycle
    else if [log_payload] =~ /^Node starting up/ {
      grok {
        match => { "log_payload" => "^Node starting up,\s+pid\s+%{INT:node_pid:int}" }
        tag_on_failure => ["_grokparsefailure_node_startup"]
      }
      if "_grokparsefailure_node_startup" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "node_lifecycle"
            "node_event" => "starting_up"
          }
        }
      }
    }
    else if [log_payload] =~ /^Node successfully started/ {
      mutate {
        add_field => {
          "event_type" => "node_lifecycle"
          "node_event" => "started"
        }
      }
    }
    else if [log_payload] =~ /requested (?:silent )?restart/ {
      grok {
        match => { "log_payload" => "^Node\s+'%{NOTSPACE:target_node}'\s+\(Node ID:\s*%{INT:target_node_id:int}(?:,\s*index:\s*%{INT:node_index:int})?\)\s+requested\s+(?:(?<restart_mode>\w+)\s+)?restart\." }
        tag_on_failure => ["_grokparsefailure_node_restart_req"]
      }
      if "_grokparsefailure_node_restart_req" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "node_lifecycle"
            "node_event" => "restart_requested"
          }
        }
      }
    }
    else if [log_payload] =~ /^Restarting with\s+\w+\s+next flag/ {
      grok {
        match => { "log_payload" => "^Restarting with\s+%{WORD:restart_flag}\s+next flag\." }
        tag_on_failure => []
      }
      mutate {
        add_field => {
          "event_type" => "node_lifecycle"
          "node_event" => "restarting_with_flag"
        }
      }
    }
    else if [log_payload] =~ /^Restarting node/ {
      grok {
        match => { "log_payload" => "^Restarting node\s+'%{NOTSPACE:target_node}'\s+\(Node ID:\s*%{INT:target_node_id:int}\)" }
        tag_on_failure => ["_grokparsefailure_node_restart"]
      }
      if "_grokparsefailure_node_restart" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "node_lifecycle"
            "node_event" => "restarting"
          }
        }
      }
    }
    else if [log_payload] =~ /^Starting node/ {
      grok {
        match => { "log_payload" => "^Starting node\s+'%{NOTSPACE:target_node}'\s+\(Node ID:\s*%{INT:target_node_id:int}(?:,\s*index:\s*%{INT:node_index:int})?\)" }
        tag_on_failure => ["_grokparsefailure_node_start"]
      }
      if "_grokparsefailure_node_start" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "node_lifecycle"
            "node_event" => "starting"
          }
        }
      }
    }
    else if [log_payload] =~ /exited with status/ {
      grok {
        match => { "log_payload" => "^Node\s+'%{NOTSPACE:target_node}'\s+\(Node ID:\s*%{INT:target_node_id:int},\s*index:\s*%{INT:node_index:int}\)\s+exited with status\s+'%{WORD:exit_status}'(?:\s+\(Real value:\s*%{WORD:exit_real_status}\))?" }
        tag_on_failure => ["_grokparsefailure_node_exit"]
      }
      if "_grokparsefailure_node_exit" not in [tags] {
        mutate {
          add_field => {
            "event_type" => "node_lifecycle"
            "node_event" => "exited"
          }
        }
      }
    }

    # J) NodeManager & Component Alarms
    else if [log_payload] =~ /^(?:NODEMANAGER\d*|NODEBASE\d*|LS\d*|RULEENGINE\d*|SFTP\d*|FTP\d*)\s+/ {
      grok {
        match => {
          "log_payload" => [
            "^%{WORD:nodemanager_code}\s+Node\s+'%{NOTSPACE:target_node}'\s+(?<node_event>failed and was restarted|aborted and was disabled|failed for the second time and was disabled|has not updated its heartbeat)",
            "^%{WORD:nodemanager_code}\s+Node index\s+%{INT:node_index:int}\s+(?<node_event>aborted|failed)",
            "^%{WORD:nodemanager_code}\s+Disk space low in root directory\s+'%{WORD:disk_directory}'.\s+Threshold is\s+(?<disk_threshold_kb>[\d,]+)\s+kB and available space is\s+(?<disk_available_kb>[\d,]+)\s+kB",
            "^%{WORD:nodemanager_code}\s+Order execution failed\.\s+Order ID:\s*'%{DATA:order_id}'\.\s+Critical order phase\s+'%{INT:order_phase}' failed",
            "^%{WORD:nodemanager_code}\s+Successfully executed\s+'%{WORD:order_type}'\s+order for lookup server\s+'%{NOTSPACE:lookup_server}'",
            "^(?<alarm_code>[A-Za-z0-9_]+)\s+(?<alarm_message>.*)$"
          ]
        }
        tag_on_failure => ["_grokparsefailure_alarm"]
      }
      if "_grokparsefailure_alarm" not in [tags] {
        mutate { add_field => { "event_type" => "system_alarm" } }
        if [disk_threshold_kb] {
          mutate {
            gsub => [
              "disk_threshold_kb", ",", "",
              "disk_available_kb", ",", ""
            ]
            convert => {
              "disk_threshold_kb" => "integer"
              "disk_available_kb" => "integer"
            }
          }
        }
      }
    }
    else if [log_payload] =~ /^(?:Error|Warning|Info)\s+message:\s+/ {
      grok {
        match => { "log_payload" => "^(?<message_severity>Error|Warning|Info)\s+message:\s+(?<error_reason>.*)$" }
        tag_on_failure => []
      }
      mutate { add_field => { "event_type" => "system_message" } }
    }

    # K) Node parameters & Environment variables
    # 1. Key: "Value" or Key: Value (Node Manager parameters dump)
    else if [log_payload] =~ /^[A-Za-z0-9_.]+:\s*/ {
      # To drop parameters and save Elasticsearch space, uncomment:
      # drop { }
      grok {
        match => {
          "log_payload" => [
            "^(?<param_name>[A-Za-z0-9_.]+):\s*\"(?<param_value>[^\"]*)\"$",
            "^(?<param_name>[A-Za-z0-9_.]+):\s*(?<param_value>.*)$"
          ]
        }
        tag_on_failure => ["_grokparsefailure_node_param"]
      }
      if "_grokparsefailure_node_param" not in [tags] {
        mutate {
          add_field => {
            "event_type"  => "node_parameter"
            "param_scope" => "Node"
          }
        }
      }
    }
    # 2. KEY=VALUE (Node environment variables dump)
    else if [log_payload] =~ /^[A-Za-z0-9_]+=/ {
      # To drop environment dumps and save Elasticsearch space, uncomment:
      # drop { }
      grok {
        match => {
          "log_payload" => "^(?<param_name>[A-Za-z0-9_]+)=(?<param_value>.*)$"
        }
        tag_on_failure => ["_grokparsefailure_node_env"]
      }
      if "_grokparsefailure_node_env" not in [tags] {
        mutate {
          add_field => {
            "event_type"  => "node_parameter"
            "param_scope" => "Environment"
          }
        }
      }
    }
    # 3. Application / Internal parameter (c_node parameter dump)
    else if [log_payload] =~ /^(?:Application|Internal)\s+parameter:\s*/ {
      # To drop parameters and save Elasticsearch space, uncomment:
      # drop { }
      grok {
        match => {
          "log_payload" => "^(?<param_scope>Application|Internal)\s+parameter:\s*(?<param_name>[^\t\s]+)(?:\s+(?<param_value>.*))?$"
        }
        tag_on_failure => ["_grokparsefailure_node_param"]
      }
      if "_grokparsefailure_node_param" not in [tags] {
        mutate { add_field => { "event_type" => "node_parameter" } }
      }
    }

    # L) Node startup/shutdown banners and section headers
    else if [log_payload] =~ /^(?:-{5,}|----\[.*?\]----|Node environment:|Other node parameters:|Internal parameters:|Environment variables:|Command was:\s+)/ {
      # To drop banners and reduce noise, uncomment:
      # drop { }
      mutate { add_field => { "event_type" => "node_banner" } }
    }

    # Fallback catch-all for unmatched payload
    else {
      mutate { add_field => { "event_type" => "general_log" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "elink-tracelog-%{+YYYY.MM.dd}"
  }
}
